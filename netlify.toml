[build]
  publish = "."

# Bloquear el acceso público a la documentación interna (queda solo en el repo)
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

# Links de pedidos: URL limpia -> la pagina de render (ANTES del catch-all)
[[redirects]]
  from = "/pedidos/:id"
  to = "/pedidos/ver.html?id=:id"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
